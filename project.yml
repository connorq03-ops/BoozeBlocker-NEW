name: BoozeBlocker
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    BUNDLE_ID_PREFIX: com.connorq03.boozeblocker
    APP_GROUP_ID: group.com.connorq03.boozeblocker
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BoozeBlocker:
    type: application
    platform: iOS
    sources: [BoozeBlocker, Shared]
    entitlements:
      path: BoozeBlocker/Resources/BoozeBlocker.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: BoozeBlocker/Resources/Info.plist
      properties:
        CFBundleDisplayName: Booze Blocker
        AppGroupIdentifier: $(APP_GROUP_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [boozeblocker]
        NSContactsUsageDescription: Booze Blocker needs access to your contacts so you can select which people to block while drinking and designate emergency contacts.
        NSFaceIDUsageDescription: Use Face ID to quickly unlock the app or verify your identity for sensitive actions.
    dependencies:
      - target: BoozeBlockerWidget
  BoozeBlockerWidget:
    type: app-extension
    platform: iOS
    entitlements:
      path: BoozeBlockerWidget/BoozeBlockerWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    sources:
      - BoozeBlockerWidget
      - Shared
      - path: BoozeBlocker/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).widget
    info:
      path: BoozeBlockerWidget/Info.plist
      properties:
        AppGroupIdentifier: $(APP_GROUP_ID)
        CFBundleDisplayName: Booze Blocker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  BoozeBlockerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BoozeBlockerTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BoozeBlocker
  BoozeBlockerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BoozeBlockerUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BoozeBlocker
